<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Rock Club - Upcoming Member Hours</title>
    <script>
        (function () {
            var d = document.documentElement, t;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (t !== "dark" && t !== "light") {
                t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            function apply() {
                d.dataset.theme = t;
                var b = document.getElementById("theme");
                if (b) b.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " theme");
            }
            apply();
            document.addEventListener("DOMContentLoaded", function () {
                apply();
                document.getElementById("theme").addEventListener("click", function () {
                    t = t === "dark" ? "light" : "dark";
                    apply();
                    try { localStorage.setItem("theme", t); } catch (e) {}
                });
            });
        })();
    </script>
    <style>
        html {
            --display: "Avenir Next Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", "Nimbus Sans Narrow", system-ui, sans-serif;
            --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            /* Granite at first light */
            color-scheme: light;
            --bg: #efe8dd;
            --bg-deep: #e4dacb;
            --topo: rgba(120, 92, 66, .1);
            --ink: #2a1f1a;
            --ink-soft: #6d5d52;
            --card: #fbf8f3;
            --card-edge: rgba(80, 56, 40, .12);
            --shadow: 0 1px 1px rgba(60, 40, 25, .06), 0 8px 24px -10px rgba(60, 40, 25, .28);
            --bolt: #dfe3e8;
            --rail: rgba(110, 82, 64, .35);
            --on-hold: #fff;
            --title-accent: #b84a14;
        }
        html[data-theme="dark"] {
            /* Same topo map at night */
            color-scheme: dark;
            --bg: #10141b;
            --bg-deep: #0b0e14;
            --topo: rgba(150, 175, 210, .07);
            --ink: #efe8de;
            --ink-soft: #9ba3b1;
            --card: #181e28;
            --card-edge: rgba(190, 210, 240, .08);
            --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 28px -12px rgba(0, 0, 0, .8);
            --bolt: #aab3c2;
            --rail: rgba(170, 185, 210, .22);
            --on-hold: #0d1118;
            --title-accent: #ff9a57;
        }

        /* Each gym gets its own tape colour, like a graded route; a gym added to
           feeds.json without a rule here falls back to the muted ink */
        .gym              { --hold: var(--ink-soft); }
        .gym-morrisville  { --hold: #13806f; }
        .gym-salvage-yard { --hold: #c0561c; }
        .gym-raleigh      { --hold: #b5305f; }
        .gym-durham       { --hold: #4c5fc9; }
        html[data-theme="dark"] .gym-morrisville  { --hold: #4fd4be; }
        html[data-theme="dark"] .gym-salvage-yard { --hold: #ff9a57; }
        html[data-theme="dark"] .gym-raleigh      { --hold: #ff7aa6; }
        html[data-theme="dark"] .gym-durham       { --hold: #94a6ff; }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--body);
            color: var(--ink);
            background: radial-gradient(120% 60% at 50% 0%, var(--bg) 40%, var(--bg-deep));
            background-color: var(--bg-deep);
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--topo);
            --contours: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><path id='c' fill='none' stroke='%23000' stroke-width='2' d='M534 279l-4 15 -2 18 1 18 4 18 7 18 6 9 8 9 10 6 12 4 12 0 12 -3 14 -7 10 -10 6 -9 7 -17 5 -21 7 -45 1 -18 0 -12 -2 -9 -3 -9 -5 -6 -10 -7 -12 -3 -12 0 -18 4 -13 6 -11 7 -12 12 -12 17zM456 513l-3 15 1 12 2 7 4 5 8 5 6 1 6 -2 6 -4 6 -6 4 -6 5 -12 2 -12 -1 -12 -4 -12 -6 -6 -6 -1 -6 2 -6 3 -6 4 -6 8zM504 281l-3 25 0 24 3 24 7 30 8 24 7 12 8 7 12 4 12 0 12 -1 24 -5 24 -10 12 -7 6 -5 11 -13 10 -18 6 -18 11 -42 15 -54 2 -18 -1 -12 -7 -18 -9 -12 -6 -6 -8 -5 -18 -6 -12 -2 -12 1 -24 4 -22 8 -20 12 -18 17 -12 16 -11 21zM721 234l-5 -18 -5 -12 -7 -12 -8 -11 -8 -7 -10 -7 -12 -6 -12 -4 -18 -2 -18 0 -18 2 -18 4 -18 6 -14 7 -16 10 -9 8 -11 12 -13 18 -9 18 -9 24 -5 18 -3 24 0 24 2 48 -1 18 -2 12 -7 18 -24 36 -11 19 -7 17 -5 24 -2 24 3 24 6 18 5 7 6 5 12 4 6 0 12 -2 18 -7 11 -7 7 -6 10 -12 8 -14 7 -16 14 -42 5 -12 9 -12 7 -6 12 -8 48 -23 18 -11 14 -12 14 -18 8 -18 18 -50 21 -52 3 -12 1 -12zM721 180l-10 -12 -9 -9 -12 -9 -12 -6 -17 -6 -13 -2 -30 -1 -18 1 -24 5 -18 4 -18 6 -18 10 -10 7 -12 12 -8 10 -12 19 -10 19 -7 18 -7 18 -4 18 -3 18 -2 66 -4 24 -8 24 -23 48 -6 18 -5 18 -4 24 -3 24 -8 84 0 18 4 12 5 6 7 3 6 -1 12 -6 23 -14 37 -21 24 -16 17 -17 12 -18 9 -18 17 -42 7 -12 10 -14 11 -10 8 -6 47 -26 16 -10 14 -12 10 -12 11 -18 24 -54 23 -42 5 -12 3 -12 1 -12 -1 -12 -5 -24 -8 -24zM724 156l-10 -10 -12 -9 -12 -7 -12 -5 -12 -4 -18 -3 -18 -1 -18 0 -30 3 -30 4 -18 4 -18 5 -12 5 -12 8 -10 10 -9 12 -13 24 -24 48 -8 18 -7 18 -4 24 -3 60 -4 24 -23 78 -6 30 -13 72 -20 72 -2 24 3 18 3 12 6 12 8 11 7 7 7 6 10 6 12 3 12 -1 6 -3 6 -5 6 -7 22 -35 10 -12 12 -12 40 -34 18 -21 14 -23 25 -54 7 -12 8 -11 12 -12 10 -7 56 -32 13 -10 11 -10 16 -20 32 -53 34 -43 5 -12 2 -12 -1 -18 -5 -24 -11 -30 -10 -24 -14 -24zM722 132l-14 -11 -18 -9 -18 -6 -24 -5 -30 -1 -78 2 -60 -2 -12 2 -6 4 -6 10 -16 46 -14 32 -12 20 -27 38 -10 18 -5 12 -3 18 0 18 3 42 0 2 24 36 -8 11 -12 9 -10 4 -8 1 -12 -2 -10 -5 -8 -5 -12 -11 -12 -14 -34 -54 -20 -24 -12 -11 -12 -8 -18 -11zM6 758l-54 -18 -24 -10 -18 -11 -6 -6 -7 -11 -4 -12 -1 -12 2 -18 5 -24 5 -18 7 -18 10 -18 9 -12 10 -10 11 -8 25 -13 24 -9 60 -19 18 -5 18 -3 12 -1 18 0 13 2 17 4 18 6 12 6 12 8 7 6 5 6 7 12 5 12 5 18 18 156 1 18 -1 18 -5 14 -6 10 -5 6 -55 50 -6 3 -6 2 -6 0 -6 -2 -12 -9 -37 -38 -23 -18 -32 -18zM6 738l-35 -12 -25 -12 -16 -12 -9 -12 -4 -12 -2 -12 1 -24 3 -18 4 -12 6 -12 7 -12 10 -11 6 -6 18 -11 24 -10 30 -9 42 -9 30 -4 18 -1 12 1 24 6 18 9 12 9 6 6 12 18 8 24 4 18 4 30 3 30 0 24 -1 18 -2 12 -4 11 -4 7 -5 6 -7 6 -14 7 -18 4 -18 1 -18 -2 -18 -5zM6 566l-18 6 -19 10 -14 12 -4 6 -7 12 -6 18 -1 12 0 12 4 18 8 12 13 12 14 9 18 7 24 7 30 6 30 3 30 2 24 -1 19 -3 11 -4 6 -4 6 -5 6 -7 7 -16 2 -12 1 -18 -3 -30 -7 -24 -6 -12 -6 -9 -12 -13 -12 -7 -18 -7 -18 -4 -24 0 -24 2 -30 4zM6 590l-12 4 -12 8 -9 10 -7 12 -2 12 0 12 4 12 9 12 11 8 12 6 12 5 18 3 18 2 18 0 24 -2 18 -3 18 -6 12 -7 6 -6 6 -12 2 -12 -2 -18 -5 -12 -9 -12 -10 -9 -12 -6 -12 -4 -18 -4 -18 -1 -24 1 -18 2z'/><use href='%23c' x='-720' y='-720'/><use href='%23c' x='-720' y='0'/><use href='%23c' x='-720' y='720'/><use href='%23c' x='0' y='-720'/><use href='%23c' x='0' y='720'/><use href='%23c' x='720' y='-720'/><use href='%23c' x='720' y='0'/><use href='%23c' x='720' y='720'/></svg>");
            -webkit-mask: var(--contours) 0 0 / 360px 360px;
            mask: var(--contours) 0 0 / 360px 360px;
            pointer-events: none;
        }
        .page {
            position: relative;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 28px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 22px 12px 22px 22px;
        }
        .title {
            margin: 0;
            font-family: var(--display);
            font-stretch: condensed;
            /* Shrinks to share the row with the toggle; wraps rather than overflow
               where no condensed font is installed */
            min-width: 0;
            font-size: clamp(26px, 8.6vw, 34px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.01em;
        }
        .title b { color: var(--title-accent); }
        .theme-toggle {
            flex: none;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .theme-toggle:hover { background: var(--card); color: var(--ink); }
        }
        .theme-toggle:focus-visible { outline: 2px solid var(--ink); }
        .theme-toggle svg { width: 22px; height: 22px; }
        html:not([data-theme]) .theme-toggle,
        html[data-theme="dark"] .icon-moon,
        html:not([data-theme="dark"]) .icon-sun { display: none; }

        /* The list is the route: a dashed line with a bolt beside every gym */
        .route {
            position: relative;
            list-style: none;
            margin: 6px 0 0;
            padding: 0 16px 0 44px;
        }
        .gym {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            padding: 12px 16px 12px 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .04), transparent 60%), var(--card);
            border: 1px solid var(--card-edge);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }
        /* Bolt hanger on the rail */
        .gym::before {
            content: "";
            position: absolute;
            left: -27px;
            top: 50%;
            width: 12px;
            height: 12px;
            margin-top: -6px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, var(--hold) 0 2.5px, var(--bolt) 3px 4px, rgba(0, 0, 0, .35) 4.5px);
            z-index: 1;
            box-shadow: 0 0 0 3px var(--bg);
        }
        /* Rope: each gym draws it down to the next card, so it runs from the first bolt's centre to the last's */
        .gym::after {
            content: "";
            position: absolute;
            left: -22px;
            top: 0;
            bottom: -12px;
            width: 2px;
            background: repeating-linear-gradient(var(--rail) 0 5px, transparent 0 9px);
        }
        .gym:first-child::after { top: 50%; }
        .gym:first-child:not(.empty):not(:last-child)::after { bottom: -18px; }
        .gym:last-child::after { bottom: 50%; }
        .when {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 62px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--hold) 13%, transparent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hold) 25%, transparent);
            font-family: var(--display);
            font-stretch: condensed;
            line-height: 1;
        }
        .when .mon {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--hold);
        }
        .when .day {
            margin-top: 3px;
            font-size: 30px;
            font-weight: 800;
            color: var(--ink);
        }
        .info { min-width: 0; }
        .name {
            margin: 0;
            font-family: var(--display);
            font-stretch: condensed;
            font-size: 23px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: .005em;
        }
        .detail {
            margin: 3px 0 0;
            font-size: 15px;
            color: var(--ink-soft);
        }
        .detail strong { color: var(--ink); font-weight: 650; white-space: nowrap; }

        /* Next session: the anchor at the top of the route */
        .gym:first-child:not(.empty) {
            padding: 18px 18px 18px 16px;
            margin-bottom: 18px;
            border-color: color-mix(in srgb, var(--hold) 45%, transparent);
            background:
                radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--hold) 16%, transparent), transparent 60%),
                linear-gradient(180deg, rgba(255, 255, 255, .05), transparent 60%),
                var(--card);
            box-shadow: var(--shadow), 0 14px 34px -16px color-mix(in srgb, var(--hold) 70%, transparent);
        }
        .gym:first-child:not(.empty)::before {
            left: -31px;
            width: 20px;
            height: 20px;
            margin-top: -10px;
            background: radial-gradient(circle, var(--on-hold) 0 3px, var(--hold) 3.5px 6px, var(--bolt) 6.5px 8px, rgba(0, 0, 0, .35) 8.5px);
            box-shadow: 0 0 0 3px var(--bg), 0 0 14px 2px color-mix(in srgb, var(--hold) 60%, transparent);
        }
        .gym:first-child:not(.empty) .info::after {
            content: "Next up";
            position: absolute;
            top: -9px;
            right: 16px;
            padding: 3px 9px 4px;
            border-radius: 999px;
            background: var(--hold);
            color: var(--on-hold);
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
            box-shadow: 0 4px 10px -4px color-mix(in srgb, var(--hold) 80%, transparent);
        }
        .gym:first-child:not(.empty) .when {
            width: 68px;
            height: 74px;
            /* Solid colour first, so the white date stays legible without color-mix() */
            background-color: var(--hold);
            background-image: linear-gradient(160deg, color-mix(in srgb, var(--hold) 82%, #fff), var(--hold));
            box-shadow: 0 6px 14px -6px var(--hold);
        }
        .gym:first-child:not(.empty) .when .mon,
        .gym:first-child:not(.empty) .when .day { color: var(--on-hold); }
        .gym:first-child:not(.empty) .when .day { font-size: 36px; }
        .gym:first-child:not(.empty) .name { font-size: 29px; }
        .gym:first-child:not(.empty) .detail { font-size: 16px; }

        /* No upcoming session: a quiet, unbolted pitch */
        .gym.empty {
            background: transparent;
            border-style: dashed;
            border-color: var(--rail);
            box-shadow: none;
        }
        .gym.empty::before { background: radial-gradient(circle, transparent 0 3px, var(--rail) 3.5px 5px, transparent 5.5px); }
        .gym.empty .when { background: none; box-shadow: inset 0 0 0 1px var(--rail); }
        .gym.empty .day { color: var(--ink-soft); font-weight: 400; }
        .gym.empty .name { color: var(--ink-soft); }
        .gym.empty .detail { font-style: italic; }

        .updated {
            margin: 22px 16px 0;
            text-align: center;
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--ink-soft);
        }
        /* Hairline with a bolt hanger ring in the middle */
        .updated::before {
            content: "";
            display: block;
            width: 140px;
            height: 12px;
            margin: 0 auto 12px;
            background:
                radial-gradient(circle, transparent 0 2.5px, var(--rail) 3px 4.5px, transparent 5px) 50% 50% / 12px 12px no-repeat,
                linear-gradient(90deg, transparent, var(--rail) 35%, var(--rail) calc(50% - 10px), transparent calc(50% - 10px) calc(50% + 10px), var(--rail) calc(50% + 10px) 65%, transparent) 50% 50% / 100% 1px no-repeat;
        }

        @media (min-width: 560px) {
            .page { padding-top: 32px; }
            .title { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="top">
            <h1 class="title">TRC <b>Member Hours</b></h1>
            <button class="theme-toggle" id="theme" type="button" aria-label="Switch theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </header>
        <ol class="route">
            %locations_content%
        </ol>
        <footer class="updated">
            Last updated: %last_updated%
        </footer>
    </div>
</body>
</html>
