name: Update Member Guest Hours

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-hours:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: update_member_hours.py
        
    - name: Parse feeds and generate page
      run: ./update_member_hours.py
      
    - name: Prepare Pages directory
      run: |
        mkdir -p _site
        cp index.html _site/
      
    - name: Setup Pages
      uses: actions/configure-pages@v6
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: './_site'
        
    # deploy-pages sometimes lists the run's artifacts before the upload above
    # shows up and fails with "No artifacts named github-pages"; try once more.
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: Wait before retrying the deploy
      if: steps.deployment.outcome == 'failure'
      run: sleep 30

    - name: Deploy to GitHub Pages (retry)
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
